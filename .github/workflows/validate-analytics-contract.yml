name: Validate analytics contract

on:
  push:
    paths:
      - "experiments/funnel-integrity/**"
      - ".github/workflows/validate-analytics-contract.yml"
  pull_request:
    paths:
      - "experiments/funnel-integrity/**"
      - ".github/workflows/validate-analytics-contract.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate measurement spec
        run: |
          python experiments/funnel-integrity/validate_measurement_spec.py \
            experiments/funnel-integrity/funnel_spec.json
      - name: Run tests
        run: |
          python -m unittest discover \
            -s experiments/funnel-integrity/tests \
            -p 'test_*.py'
