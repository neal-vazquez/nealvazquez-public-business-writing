name: Validate book source workflow

on:
  push:
    paths:
      - "book/**"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/validate-book-workflow.yml"
  pull_request:
    paths:
      - "book/**"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/validate-book-workflow.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate synthetic source records
        run: python book/tools/source_intake.py validate book/examples/synthetic-intake.jsonl
      - name: Test source integrity and review packets
        run: python -m unittest discover -s book/tests -p 'test_*.py'
